<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Code-along Activity: Quiz Form</title>
</head>

<body>
    <header>
        <h1>W05 Code-along Activity: Quiz Form</h1>
    </header>

    <main>
        <form>
            <div class="form-input">
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="form-input">
                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2" rows="4"></textarea>
            </div>
            <div class="form-input">
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one option</option>
                    <option value="1">--</option>
                    <option value="2">/**/</option>
                    <option value="3">#</option>
                    <option value="4">&lt;!-- -&gt;</option>
                </select>
            </div>
            <div class="form-input">
                <label for="q4">
                    What is the bottom margin given this declaration?
                    <pre>margin: 10px 5px 15px;</pre>
                </label>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">
                Submit Quiz
            </button>
        </form>
    </main>

    <footer>
        &copy; 2026 | W05 Code-along Activity: Quiz Form | Samuel dos Santos
    </footer>
</body>

</html>
