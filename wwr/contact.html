<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Samuel dos Santos">
    <meta name="description"
      content="Get in touch with White Water Rafting! Contact us to book your next river adventure, ask questions, or plan your family trip today.">
    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body class="page-contact">
    <header>
        <div class="content">
            <a href="index.html">
                <img src="images/logo.svg" alt="White Water Rafting Company">
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="breadcrumb">
        <nav class="content">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <span>Contact</span>
                </li>
            </ul>
        </nav>
    </div>
    <main>
        <div class="contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2865244.0975352046!2d-116.7815144835616!3d45.46799212833759!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5358ffa885e499e9%3A0xd06b300515f78758!2sIdaho%2C%20USA!5e0!3m2!1sen!2sbr!4v1785292422333!5m2!1sen!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="content">
                <div class="info">
                    <address>
                        <div>
                            <p>White Water Rafting Company</p>
                            <p>123 main River Street</p>
                            <p>kolob, California</p>
                            <p>+1 999 999 9999</p>
                            <p><a href="http://www.example.com/contact">info@whitewater.com</a></p>
                        </div>
                    </address>
                    <form>
                        <div class="form-input">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name"
                              placeholder="What is your full name?">
                        </div>
                        <div class="form-input">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email"
                              placeholder="What is your best email">
                        </div>
                        <div class="form-input radio-group">
                            <p class="label-heading">Message Purpose</p>

                            <div class="radio-options">
                                <label for="general">
                                    <input type="radio" id="general" name="purpose"
                                      value="general_inquiry" checked>
                                    General Inquiry
                                </label>

                                <label for="reservation">
                                    <input type="radio" id="reservation" name="purpose"
                                      value="reservation_question">
                                    Reservation Question
                                </label>

                                <label for="suggestion">
                                    <input type="radio" id="suggestion" name="purpose"
                                      value="website_suggestion">
                                    Website Suggestion
                                </label>
                            </div>
                        </div>
                        <div class="form-input">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" rows="4"
                              placeholder="Type your message here..."></textarea>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" name="subscribe_newsletter"
                              id="subscribe_newsletter">
                            <label for="subscribe_newsletter">Please subscribe me to the monthly
                                newsletter</label>
                        </div>

                        <div class="form-actions">
                            <button type="submit">Get in Touch!</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <section class="team">
            <h1>We Are Here to Serve you</h1>

            <ul>
                <li>
                    <figure>
                        <img src="images/team/jennifer.jpg" alt="Jennifer Hayes">
                        <figcaption>Jennifer Hayes</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/team/eleonor.jpg" alt="Eleonor Vance">
                        <figcaption>Eleonor Vance</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/team/phil.jpg" alt="Phil Bennet">
                        <figcaption>Phil Bennet</figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        <div class="content">
            <p>&copy; 2026 | White Water Rafting | Samuel dos Santos</p>

            <nav>
                <ul>
                    <li>
                        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                            <img src="images/icons/facebook.png" alt="Facebook Icon">
                        </a>
                    </li>
                    <li>
                        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                            <img src="images/icons/linkedin.png" alt="LinkedIn Icon">
                        </a>
                    </li>
                    <li>
                        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                            <img src="images/icons/instagram.png" alt="Instagram Icon">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>
</body>

</html>
